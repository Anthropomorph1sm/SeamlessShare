services:
  app:
    image: anthropomorphism/seamless-share:${SHARE_IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      ASPNETCORE_URLS: http://+:8080
      SHARE_DATA_DIR: /app/data
      SHARE_TRUST_PROXY: "true"
    volumes:
      - ./data:/app/data
    networks:
      - internal
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    environment:
      SHARE_HOST: ${SHARE_HOST:?Set SHARE_HOST in .env to the server's fixed LAN address or local hostname}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - internal

networks:
  internal:

volumes:
  caddy_data:
  caddy_config:
