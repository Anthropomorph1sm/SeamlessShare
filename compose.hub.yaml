name: seamlessshare

services:
  app:
    image: anthropomorphism/seamless-share:latest
    restart: unless-stopped
    environment:
      ASPNETCORE_URLS: http://+:8080
      SHARE_DATA_DIR: /app/data
      SHARE_TRUST_PROXY: "true"
    volumes:
      - /DATA/AppData/SeamlessShare/data:/app/data
    networks:
      - internal
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    # Replace this example IP with your server's LAN IP or local DNS name.
    # If you change 8443, change it in both --from and ports below.
    entrypoint: ["caddy"]
    command:
      - reverse-proxy
      - --from
      - https://192.168.1.50:8443
      - --to
      - app:8080
      - --internal-certs
      - --disable-redirects
    ports:
      - "8443:8443"
    volumes:
      - /DATA/AppData/SeamlessShare/caddy-data:/data
      - /DATA/AppData/SeamlessShare/caddy-config:/config
    networks:
      - internal

networks:
  internal:
